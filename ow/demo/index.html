<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f2ec">
<title>One Wallet — free demo</title>


<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="One Wallet">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* ============================================================
   One Wallet — dashboard shell.
   Dense, panelled, data-first. Chart palette validated both modes.
   ============================================================ */
:root{
  --bg:#f3efe9; --panel:#fffefb; --panel-2:#f7f3ed; --panel-3:#efe9e0;
  --line:#e3dcd0; --line-2:#d2c9ba;
  --ink:#231f1a; --ink-2:#5f564c; --ink-3:#71685f;
  --brand:#2f7a68; --brand-2:#246153; --brand-soft:#e0efe9; --brand-glow:rgba(47,122,104,.13);
  --good:#2f7a68; --warn:#a9762f; --bad:#a44b40;
  --s1:#15917a; --s2:#d2622f; --s3:#4b5fd0; --s4:#d79a1a; --s5:#b5478f; --s6:#5c9e2d;
  --grid:#e3dcd0; --axis:#8d8378;
  --r:10px; --r-sm:7px;
  --sh:0 1px 2px rgba(35,31,26,.04);
  --sh-2:0 1px 3px rgba(35,31,26,.06), 0 8px 24px -10px rgba(35,31,26,.14);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --nums:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  --sidebar:238px;
}
:root[data-theme="midnight"]{
  --bg:#0d1117; --panel:#161c26; --panel-2:#1c232f; --panel-3:#242c3a;
  --line:#262e3c; --line-2:#36404f;
  --ink:#edf1f7; --ink-2:#9aa5b8; --ink-3:#8a93a2;
  --brand:#5fc5ac; --brand-2:#7ad4bd; --brand-soft:#15302a; --brand-glow:rgba(95,197,172,.16);
  --good:#5fc5ac; --warn:#d4a257; --bad:#e08b80;
  --s1:#21937b; --s2:#d9703c; --s3:#6b7cd8; --s4:#b08a26; --s5:#c45f9f; --s6:#68a440;
  --grid:#262e3c; --axis:#6b7586;
  --sh:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 1px 3px rgba(0,0,0,.45), 0 8px 24px -10px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;
  overscroll-behavior-y:none}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.012em}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
.num,.n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding:0 0 92px}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:saturate(1.5) blur(12px);-webkit-backdrop-filter:saturate(1.5) blur(12px);
  border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;gap:10px}
.topbar .mark{width:26px;height:26px;flex:none}
.topbar .ttl{font-size:15px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink-2);
  border:1px solid transparent;transition:background .14s,border-color .14s;flex:none}
.iconbtn:hover{background:var(--panel-2);border-color:var(--line);color:var(--ink)}
.wrap{padding:16px}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  margin-bottom:14px;overflow:hidden;display:flex;flex-direction:column}
.panel > .ph{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);
  background:var(--panel-2)}
.panel > .ph h3{font-size:11px;text-transform:uppercase;letter-spacing:.075em;color:var(--ink-2);font-weight:750}
.panel > .ph .meta{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-weight:600}
.panel > .pb{padding:14px;flex:1;min-height:0}
.panel > .pb.mid{display:flex;flex-direction:column;justify-content:center}
.panel > .pf{margin-top:auto;border-top:1px solid var(--line);background:var(--panel-2);padding:9px 14px}
.panel > .pf .kv{padding:2px 0;font-size:12.5px}
/* A long list must not set the height of a whole dashboard row. */
.dl.cap{max-height:264px;overflow-y:auto;overscroll-behavior:contain}
.dl.cap::-webkit-scrollbar{width:7px}
.dl.cap::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
.panel > .pb.flush{padding:0}
.panel.accent > .ph{background:var(--brand-soft);border-bottom-color:transparent}
.panel.accent > .ph h3{color:var(--brand)}

/* ---------- KPI strip ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;box-shadow:var(--sh);min-width:0;overflow-wrap:anywhere}
.kpi .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:750;
  display:flex;align-items:center;gap:6px}
.kpi .v{font-family:var(--nums);font-size:22px;overflow-wrap:normal;font-weight:720;letter-spacing:-.025em;margin-top:5px;
  font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .d{font-size:11px;color:var(--ink-3);margin-top:3px}
.kpi.lead{grid-column:1 / -1;background:linear-gradient(135deg,var(--brand-soft),var(--panel) 70%)}
.kpi.lead .v{font-size:38px;color:var(--brand)}
.kpi.lead .v.neg{color:var(--bad)}
.kpi .spark{height:3px;border-radius:2px;background:var(--panel-3);margin-top:8px;overflow:hidden}
.kpi .spark i{display:block;height:100%;background:var(--brand);border-radius:2px}

/* ---------- data rows / tables ---------- */
.dl{width:100%}
.dl .r{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.dl .r:last-child{border-bottom:0}
.dl .r:hover{background:var(--panel-2)}
.dl .m{flex:1;min-width:0;text-align:left}
.dl .t{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl .s{font-size:11.5px;color:var(--ink-3);margin-top:1px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dl .a{font-family:var(--nums);font-weight:680;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13.5px}
.muted{color:var(--ink-3)} .strike{text-decoration:line-through;opacity:.45}
.pos{color:var(--good)} .neg{color:var(--bad)}
.swatch{width:9px;height:9px;border-radius:2px;flex:none}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--panel-3);color:var(--ink-2)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:var(--r-sm);
  font-weight:650;font-size:13.5px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);
  transition:background .14s,transform .1s}
.btn:hover{background:var(--panel-3)} .btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:#fff;border-color:transparent}
.btn.primary:hover{background:var(--brand-2)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.block{width:100%} .btn.danger{color:var(--bad)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel-2);border-radius:var(--r-sm);padding:2px;gap:2px;border:1px solid var(--line)}
.seg button{padding:5px 11px;border-radius:5px;font-size:12px;font-weight:650;color:var(--ink-2)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--sh)}
.quick{display:flex;gap:8px}
.quick input{flex:1;min-width:0;padding:9px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel-2);font-size:13.5px}
.quick .btn{flex:none}
.quick input:focus{outline:none;background:var(--panel);box-shadow:0 0 0 3px var(--brand-glow);border-color:var(--brand)}
.tick{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line-2);flex:none;display:grid;
  place-items:center;color:transparent;transition:all .14s}
.tick:hover{border-color:var(--brand)} .tick.on{background:var(--brand);border-color:var(--brand);color:#fff}
.bar{height:6px;border-radius:3px;background:var(--panel-3);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--brand)}

/* ---------- forms ---------- */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:650;color:var(--ink-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 11px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--panel-2)}
.field input:focus,.field select:focus{outline:none;background:var(--panel);box-shadow:0 0 0 3px var(--brand-glow);border-color:var(--brand)}
.field .hint{font-size:11.5px;color:var(--ink-3);margin-top:4px;line-height:1.4}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.check{display:flex;align-items:flex-start;gap:10px;padding:8px 0;cursor:pointer}
.check input{margin-top:3px;width:17px;height:17px;flex:none;accent-color:var(--brand)}
.check .ct{font-size:13.5px;font-weight:600} .check .cs{font-size:12px;color:var(--ink-3);margin-top:2px;line-height:1.4}

/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--panel) 94%,transparent);
  backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);
  border-top:1px solid var(--line);display:flex;padding:5px 2px calc(5px + env(safe-area-inset-bottom))}
.nav button{flex:1;padding:5px 1px 3px;display:grid;place-items:center;gap:2px;color:var(--ink-3);
  font-size:9.5px;font-weight:700}
.nav .ni{display:grid;place-items:center;padding:4px 11px;border-radius:999px;transition:background .16s}
.nav button.on{color:var(--brand)} .nav button.on .ni{background:var(--brand-soft)}
.nav svg{width:19px;height:19px}

/* ---------- charts ---------- */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart .gridline{stroke:var(--grid);stroke-width:1}
.chart .axislbl{fill:var(--ink-3);font-size:10px;font-weight:650;font-family:var(--font)}
.chart .vallbl{fill:var(--ink-2);font-size:10.5px;font-weight:700;font-family:var(--nums)}
.chart .catlbl{fill:var(--ink);font-size:11.5px;font-weight:600;font-family:var(--font)}
.chart .mark{transition:opacity .12s}
.chart.dim .mark{opacity:.4} .chart .mark.hot{opacity:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:650;
  padding:6px 9px;border-radius:6px;white-space:nowrap;opacity:0;transition:opacity .12s;z-index:5;
  transform:translate(-50%,-120%)}
.tip.on{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px;align-items:center}
.legend i{display:inline-flex;align-items:center;gap:6px;font-style:normal;font-size:11.5px;color:var(--ink-2);font-weight:650}
.legend .sw{width:9px;height:9px;border-radius:2px;flex:none}
.tablebtn{font-size:11px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;font-weight:650}
table.dtable{width:100%;border-collapse:collapse;font-size:12.5px}
table.dtable th,table.dtable td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.dtable th{color:var(--ink-3);font-weight:750;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
table.dtable td.n{text-align:right;font-family:var(--nums);font-weight:650}

/* ---------- misc ---------- */
.empty{text-align:center;padding:22px 14px;color:var(--ink-3);font-size:13px;line-height:1.5}
.banner{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);
  border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.5;box-shadow:var(--sh)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:13px}
.kv .k{color:var(--ink-2)} .kv .v{font-variant-numeric:tabular-nums;font-weight:650;font-family:var(--nums)}
.kv.total{border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-weight:750}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .dh{text-align:center;font-size:9.5px;color:var(--ink-3);font-weight:800;padding:3px 0}
.cal .dc{aspect-ratio:1;min-width:0;overflow:hidden;border-radius:6px;background:var(--panel-2);padding:3px;font-size:10.5px;
  display:flex;flex-direction:column;align-items:center;border:1px solid transparent;font-variant-numeric:tabular-nums}
.cal .dc.today{border-color:var(--brand);background:var(--brand-soft);font-weight:750;color:var(--brand)}
.cal .dc.blank{background:transparent}
.cal .pips{display:flex;gap:2px;margin-top:auto;flex-wrap:wrap;justify-content:center}
.cal .pip{width:4px;height:4px;border-radius:50%}
.toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,12px);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:80;opacity:0;pointer-events:none;
  transition:all .2s;max-width:88vw;text-align:center;box-shadow:var(--sh-2)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
.demo-bar{background:var(--warn);color:#fff;text-align:center;padding:7px 14px;font-size:12px;font-weight:650}
.ring{width:42px;height:42px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .track{stroke:var(--panel-3)} .ring .fill{stroke:var(--brand);stroke-linecap:round}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:13px;font-weight:780;color:var(--brand);font-variant-numeric:tabular-nums;line-height:1}
.ring .lbl small{font-size:6.5px;font-weight:750;letter-spacing:.07em;color:var(--ink-3);text-transform:uppercase;margin-top:1px}

/* ---------- sheet ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(18,14,10,.45);backdrop-filter:blur(2px);z-index:60;
  opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);border-radius:14px 14px 0 0;
  max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .26s cubic-bezier(.22,.9,.26,1);
  padding-bottom:calc(18px + env(safe-area-inset-bottom));box-shadow:0 -16px 48px -16px rgba(18,14,10,.5);
  max-width:520px;margin:0 auto}
.sheet.on{transform:none}
.sheet .sh{position:sticky;top:0;background:var(--bg);padding:13px 16px 11px;display:flex;align-items:center;
  gap:10px;border-bottom:1px solid var(--line);z-index:2}
.sheet .sh h2{font-size:16px;flex:1;font-weight:700}
.sheet .sb{padding:16px}
.grab{width:34px;height:4px;border-radius:2px;background:var(--line-2);margin:8px auto 0}

@media (max-width:999px){
  .panel > .ph{flex-wrap:wrap;row-gap:8px}
  .panel > .ph .seg{margin-left:0!important;width:100%}
  .panel > .ph .seg button{flex:1}
  .panel > .pf > div[style*="grid"]{grid-template-columns:1fr!important}
}
/* Keyboard users must be able to see where they are. */
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:var(--r-sm)}
.nav button:focus-visible,.side .navitem:focus-visible{outline-offset:-2px}
.field input:focus-visible,.quick input:focus-visible{outline:none}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ============================================================
   Desktop: real dashboard — fixed sidebar, dense multi-panel grid
   ============================================================ */
@media (min-width:1000px){
  body{font-size:13.5px}
  .side{display:flex;flex-direction:column;width:var(--sidebar);flex:none;position:sticky;top:0;height:100vh;
    background:var(--panel);border-right:1px solid var(--line);padding:16px 12px}
  .side .brandrow{display:flex;align-items:center;gap:9px;padding:4px 8px 16px}
  .side .brandrow .mark{width:26px;height:26px;flex:none}
  .side .brandrow .nm{font-size:14.5px;font-weight:750;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side .seclbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);
    font-weight:750;padding:12px 8px 6px}
  .side a, .side .navitem{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:var(--r-sm);
    font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:background .14s,color .14s}
  .side .navitem:hover{background:var(--panel-2);color:var(--ink)}
  .side .navitem.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
  .side .navitem svg{width:17px;height:17px;flex:none}
  .side .foot{margin-top:auto;padding:10px 8px 2px;border-top:1px solid var(--line);
    font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:8px}
  .nav{display:none}
  .main{padding-bottom:28px}
  .topbar{padding:14px 24px;background:var(--bg);border-bottom:1px solid var(--line);backdrop-filter:none}
  .topbar .mark{display:none}
  .topbar .ttl{font-size:19px;font-weight:720;letter-spacing:-.018em}
  .wrap{padding:20px 24px;max-width:1880px}
  .kpis{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
  .kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .kpi.lead{grid-column:span 1;background:linear-gradient(135deg,var(--brand-soft),var(--panel) 72%)}
  .kpi.lead .v{font-size:26px}
  .dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;align-items:stretch}
  .dash > .panel{margin-bottom:0}
  .col-4{grid-column:span 4} .col-5{grid-column:span 5} .col-6{grid-column:span 6}
  .col-7{grid-column:span 7} .col-8{grid-column:span 8} .col-12{grid-column:span 12}
  .toast{bottom:28px}
}

</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
    <div id="demoBar" class="demo-bar hidden"></div>
    <div class="topbar" id="topbar">
      <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="34" fill="#c0663c"/><path d="M50 16a34 34 0 0 1 0 68z" fill="#2f7a68"/>
      </svg>
      <div class="ttl" id="ttl">Overview</div>
      <button class="iconbtn" id="themeBtn" aria-label="Switch theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
    <main class="wrap" id="view"></main>
  </div>
</div>
<nav class="nav" id="nav"></nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="sh"><h2 id="sheetTitle"></h2><button class="iconbtn" id="sheetClose" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button></div>
  <div class="sb" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>window.OW_DEMO=true;</script>
<script>
"use strict";
/* ============================================================
   One Wallet — a calm money dashboard for one.
   ============================================================ */
const DEMO = window.OW_DEMO === true;
const DEMO_SPEND_CAP = 40;
const KEY = DEMO ? "onewallet.demo.v1" : "onewallet.v1";

const $ = (s,r=document)=>r.querySelector(s);
const uid = ()=>Math.random().toString(36).slice(2,10);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- dates: local only, never toISOString ---------- */
const pad2 = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const todayISO = ()=> iso(new Date());
const parse = s => { const [y,m,d]=String(s).split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n)=>{ const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const addMonths = (s,n)=>{ const d=parse(s); const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n);
  d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate())); return iso(d); };
const daysBetween = (a,b)=> Math.round((parse(b)-parse(a))/86400000);
const monthKey = s => String(s).slice(0,7);
const dayClamp = (y,m,day)=> Math.min(day, new Date(y,m+1,0).getDate());
const fmtDate = s => parse(s).toLocaleDateString(undefined,{month:"short",day:"numeric"});
const fmtDateLong = s => parse(s).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
const fmtMonth = mk => parse(mk+"-01").toLocaleDateString(undefined,{month:"short"});

let state=null, ui={tab:"today", calMonth:monthKey(todayISO()), debtOrder:"balance", yearOffset:0, catRange:30};

function money(n){ const c=state.settings.currency||"$"; const neg=n<0;
  return (neg?"−":"")+c+Math.abs(Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function money0(n){ const c=state.settings.currency||"$"; const neg=n<0;
  return (neg?"−":"")+c+Math.abs(Math.round(Number(n)||0)).toLocaleString(); }
function moneyK(n){ const c=state.settings.currency||"$"; const a=Math.abs(n);
  const s = a>=1000 ? (a/1000).toFixed(a>=10000?0:1)+"k" : Math.round(a);
  return (n<0?"−":"")+c+s; }

function exampleState(){

  s.exampleData=true; s.settings.name="My money";
  s.accounts=[

    {id:uid(),name:"Savings",kind:"save",balance:6400}
  ];
  s.incomes=[{id:uid(),name:"Salary",amount:3150,freq:"monthly",day:28,anchor:t,earlyWeekend:true,autoSave:10}];
  s.bills=[
    {id:uid(),name:"Rent",amount:1150,freq:"monthly",day:1,sinking:false,paid:[]},
    {id:uid(),name:"Electricity",amount:84,freq:"monthly",day:12,sinking:false,paid:[]},
    {id:uid(),name:"Internet",amount:42,freq:"monthly",day:18,sinking:false,paid:[]},
    {id:uid(),name:"Phone",amount:26,freq:"monthly",day:22,sinking:false,paid:[]},
    {id:uid(),name:"Car insurance",amount:612,freq:"everyN",everyN:6,anchor:addMonths(t,2),sinking:true,paid:[]},
    {id:uid(),name:"Gym",amount:32,freq:"monthly",day:6,sinking:false,paid:[]}
  ];
  // A full year of history, so the 12-month charts are meaningful rather than half empty.
  const cats=["Groceries","Eating out","Transport","Subscriptions","Shopping","Health"];
  const base={Groceries:54,"Eating out":27,Transport:14,Subscriptions:11,Shopping:38,Health:19};
  s.spends=[];
  for(let d=0; d<365; d++){
    const date=addDays(t,-d);
    const n = d%3===0 ? 2 : 1;
    for(let i=0;i<n;i++){
      const c=cats[(d*2+i)%cats.length];
      s.spends.push({id:uid(),date,amount:+(base[c]*(0.6+((d*7+i*13)%60)/100)).toFixed(2),category:c,note:"",seed:true});
    }
  }
  s.envelopes=[{id:uid(),name:"Groceries",limit:480},{id:uid(),name:"Eating out",limit:160},
               {id:uid(),name:"Transport",limit:120},{id:uid(),name:"Shopping",limit:150}];
  s.goals=[{id:uid(),name:"Emergency fund",target:6000,saved:3250,monthly:250},
           {id:uid(),name:"New laptop",target:1400,saved:380,monthly:100}];
  s.debts=[{id:uid(),name:"Credit card",balance:1480,rate:21.9,minimum:55,payments:[]},
           {id:uid(),name:"Car loan",balance:4900,rate:4.4,minimum:165,payments:[]}];
  s.assets=[{id:uid(),name:"Savings",kind:"asset",value:6400},
            {id:uid(),name:"Current account",kind:"asset",value:2180},
            {id:uid(),name:"Car",kind:"asset",value:7200},
            {id:uid(),name:"Pension",kind:"asset",value:18400}];
  // 12 months of net-worth history, trending up
  const nowWorth = s.assets.reduce((a,x)=>a+x.value,0) - s.debts.reduce((a,d)=>a+d.balance,0);
  const steps=[]; let acc=0;
  for(let i=11;i>=0;i--){ const st = 380 + ((i*37)%260) - (i===7?900:0); steps.push(st); acc+=st; }
  let w = nowWorth - acc;                      // walk back so the series lands on today's figure
  for(let i=0;i<12;i++){
    w += steps[i];
    s.worthLog.push({month: monthKey(addMonths(t,-(11-i))), value: Math.round(w)});
  }
  s.bills.forEach(b=>billDates(b, addDays(t,-370), addDays(t,-1)).forEach(d=>b.paid.push(d)));
  return s;
}

/* ============================================================
   Schedules
   ============================================================ */
function adjustWeekend(d, early){ if(!early) return d;
  const w=parse(d).getDay(); if(w===6) return addDays(d,-1); if(w===0) return addDays(d,-2); return d; }

function incomeDates(inc, from, to){
  const out=[]; const push=d=>{ if(d>=from&&d<=to) out.push(adjustWeekend(d, inc.earlyWeekend)); };
  if(inc.freq==="weekly"||inc.freq==="biweekly"){
    const step=inc.freq==="weekly"?7:14; let d=inc.anchor||from;
    while(d>from) d=addDays(d,-step);
    while(d<=to){ push(d); d=addDays(d,step); }
  } else if(inc.freq==="semimonthly"){
    let m=monthKey(from); const n=Math.max(2,Math.ceil(daysBetween(from,to)/28)+2);
    for(let i=0;i<n;i++){ const [y,mo]=m.split("-").map(Number);
      [inc.day||15, inc.day2||30].forEach(dd=>push(iso(new Date(y,mo-1,dayClamp(y,mo-1,dd)))));
      m=monthKey(addMonths(m+"-01",1)); }
  } else if(inc.freq==="monthly"){
    let m=monthKey(from); const n=Math.max(2,Math.ceil(daysBetween(from,to)/28)+2);
    for(let i=0;i<n;i++){ const [y,mo]=m.split("-").map(Number);
      push(iso(new Date(y,mo-1,dayClamp(y,mo-1,inc.day||1)))); m=monthKey(addMonths(m+"-01",1)); }
  } else if(inc.freq==="once"){ if(inc.anchor) push(inc.anchor); }
  return [...new Set(out)].filter(d=>d>=from&&d<=to).sort();
}

function billDates(b, from, to){
  const out=[]; const push=d=>{ if(d>=from&&d<=to) out.push(d); };
  // Cover the whole requested span: a fixed iteration count silently truncates
  // long ranges (a year view would lose its later months).
  const spanMonths = Math.max(2, Math.ceil(daysBetween(from,to)/28) + 2);
  if(b.freq==="monthly"){
    let m=monthKey(addMonths(from,-1));
    for(let i=0;i<spanMonths;i++){ const [y,mo]=m.split("-").map(Number);
      push(iso(new Date(y,mo-1,dayClamp(y,mo-1,b.day||1)))); m=monthKey(addMonths(m+"-01",1)); }
  } else if(b.freq==="semimonthly"){
    let m=monthKey(addMonths(from,-1));
    for(let i=0;i<spanMonths;i++){ const [y,mo]=m.split("-").map(Number);
      [b.day||1,b.day2||15].forEach(dd=>push(iso(new Date(y,mo-1,dayClamp(y,mo-1,dd))))); m=monthKey(addMonths(m+"-01",1)); }
  } else if(b.freq==="weekly"||b.freq==="biweekly"){
    const step=b.freq==="weekly"?7:14; let d=b.anchor||from;
    while(d>from) d=addDays(d,-step);
    while(d<=to){ push(d); d=addDays(d,step); }
  } else if(b.freq==="everyN"){
    const n=Math.max(1,b.everyN||3); let d=b.anchor||from;
    while(d>from) d=addMonths(d,-n);
    while(d<=to){ push(d); d=addMonths(d,n); }
  } else if(b.freq==="once"){ if(b.anchor) push(b.anchor); }
  return [...new Set(out)].sort();
}
const billPaid=(b,d)=>(b.paid||[]).includes(d);
function toggleBill(b,d){ b.paid=b.paid||[]; const i=b.paid.indexOf(d);
  if(i>=0) b.paid.splice(i,1); else b.paid.push(d); save(); render(); }
function billMonthly(b){ return {monthly:b.amount, semimonthly:b.amount*2, weekly:b.amount*52/12,
  biweekly:b.amount*26/12, everyN:b.amount/Math.max(1,b.everyN||3), once:0}[b.freq]||0; }
const ordinal=n=>{const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);};
const freqLabel=b=>({monthly:`Monthly on the ${ordinal(b.day||1)}`,semimonthly:`Twice a month`,
  weekly:"Every week",biweekly:"Every 2 weeks",everyN:`Every ${b.everyN||3} months`,once:"Just once"}[b.freq]||"");

/* ============================================================
   Maths
   ============================================================ */
const spendBal = ()=> state.accounts.filter(a=>a.kind==="spend").reduce((t,a)=>t+(+a.balance||0),0);
function monthlyIncome(){ return state.incomes.reduce((t,i)=>{
  const g={weekly:i.amount*52/12,biweekly:i.amount*26/12,semimonthly:i.amount*2,monthly:i.amount,once:0}[i.freq]||0;
  return t+g*(1-(i.autoSave||0)/100); },0); }
function nextPayday(){ const f=todayISO(), to=addDays(f,70); let best=null;
  state.incomes.forEach(i=>incomeDates(i,f,to).forEach(d=>{ if(d>=f&&(!best||d<best.date)) best={date:d,inc:i}; }));
  return best; }
function sinkingReserve(){ return state.bills.filter(b=>b.sinking).reduce((t,b)=>{
  const next=billDates(b,todayISO(),addDays(todayISO(),400))[0]; if(!next) return t;
  const away=Math.max(0,Math.round(daysBetween(todayISO(),next)/30));
  const saved=Math.max(0,(b.everyN||1)-away);
  return t+Math.min(b.amount, billMonthly(b)*saved); },0); }
const goalReserve = ()=> state.goals.reduce((t,g)=>t+(+g.monthly||0),0);

function safeToSpend(){
  const np=nextPayday(); const until=np?np.date:addDays(todayISO(),14); const from=todayISO();
  let bills=0;
  state.bills.forEach(b=>billDates(b,from,until).forEach(d=>{ if(!billPaid(b,d)&&!b.sinking) bills+=b.amount; }));
  const reserve=sinkingReserve()+goalReserve(), bal=spendBal();
  return {value:bal-bills-reserve, bal, bills, reserve, until, days:daysBetween(from,until), inc:np&&np.inc};
}
const envSpent = env => state.spends.filter(s=>monthKey(s.date)===monthKey(todayISO())&&s.category===env.name)
  .reduce((t,s)=>t+s.amount,0);

function netWorth(){
  const assets=state.assets.filter(a=>a.kind==="asset").reduce((t,a)=>t+(+a.value||0),0);
  const debts=state.debts.reduce((t,d)=>t+(+d.balance||0),0);
  return {assets, debts, net:assets-debts};
}
function spendByCategory(days){
  const d = days || ui.catRange;
  const m={};
  if(d==="month"){
    const mk=monthKey(todayISO());
    state.spends.filter(s=>monthKey(s.date)===mk).forEach(s=>{ m[s.category||"Other"]=(m[s.category||"Other"]||0)+s.amount; });
  } else {
    const from=addDays(todayISO(), -(+d)+1);
    state.spends.filter(s=>s.date>=from).forEach(s=>{ m[s.category||"Other"]=(m[s.category||"Other"]||0)+s.amount; });
  }
  return Object.entries(m).map(([k,v])=>({cat:k,val:v})).sort((a,b)=>b.val-a.val);
}
const catRangeLabel = ()=> ui.catRange==="month" ? "this month" : `last ${ui.catRange} days`;
function yearMonths(){
  const out=[]; const base=addMonths(todayISO(), ui.yearOffset*12);
  for(let i=11;i>=0;i--){
    const mk=monthKey(addMonths(base,-i));
    const out_=state.spends.filter(s=>monthKey(s.date)===mk).reduce((t,s)=>t+s.amount,0);
    let billsOut=0;
    const mEnd=addDays(monthKey(addMonths(mk+"-01",1))+"-01",-1);
    state.bills.forEach(b=>billDates(b,mk+"-01",mEnd).forEach(d=>{ if(billPaid(b,d)) billsOut+=b.amount; }));
    let inMoney=0;
    state.incomes.forEach(i=>incomeDates(i,mk+"-01",monthKey(addMonths(mk+"-01",1))+"-01").forEach(()=>{
      inMoney += i.amount*(1-(i.autoSave||0)/100); }));
    out.push({mk, inM:inMoney, outM:out_+billsOut});
  }
  return out;
}

/* ============================================================
   Charts — forms chosen by job; palette validated; hover by default
   ============================================================ */
const SERIES = ["--s1","--s2","--s3","--s4","--s5","--s6"];
const sVar = i => `var(${SERIES[i % SERIES.length]})`;

/** Magnitude by identity → horizontal bars, direct labels (relief for low-contrast slot). */
/** The dashboard grid switches at 1000px, but a 1024px screen gives each
    column barely 600px. One canvas for every desktop width therefore squashed
    the charts on small laptops, so size them in three tiers instead. */
const wideLayout = () => window.innerWidth >= 1000;
const layoutTier = () => window.innerWidth >= 1400 ? 2 : window.innerWidth >= 1000 ? 1 : 0;
const pick = (phone, laptop, wide) => [phone, laptop, wide][layoutTier()];

function chartCategories(data, id){
  if(!data.length) return `<div class="empty">Nothing logged yet.</div>`;
  const top = data.slice(0,6);
  const other = data.slice(6).reduce((t,d)=>t+d.val,0);
  const rows = other>0 ? [...top,{cat:"Other",val:other}] : top;
  const max = Math.max(...rows.map(r=>r.val))||1;
  const wide=wideLayout();
  const H=30, GAP=10, LW=wide?130:94, RW=wide?80:56, W=pick(400,620,900);
  const h = rows.length*(H+GAP)-GAP;
  const bars = rows.map((r,i)=>{
    const y=i*(H+GAP), w=Math.max(4,(W-LW-RW)*(r.val/max));
    const col = r.cat==="Other" ? "var(--ink-3)" : sVar(i);
    return `<g class="mark" data-i="${i}">
      <text class="catlbl" x="0" y="${y+H/2+4}">${esc(r.cat.length>13?r.cat.slice(0,12)+"…":r.cat)}</text>
      <rect x="${LW}" y="${y+4}" width="${w}" height="${H-8}" rx="4" fill="${col}"/>
      <text class="vallbl" x="${LW+w+8}" y="${y+H/2+4}">${moneyK(r.val)}</text>
    </g>`;
  }).join("");
  return `<div class="chart" id="${id}">
    <svg viewBox="0 0 ${W} ${h}" role="img" aria-label="Spending by category">${bars}</svg>
    <button class="tablebtn" data-act="tableCats">Show as table</button>
  </div>`;
}

/** Change over time, one series → area + line, no legend needed. */
function chartNetWorth(points, id){
  if(points.length<2) return `<div class="empty">Add assets to see your net worth over time.</div>`;
  const W=pick(430,760,1120), H=200, P=10, BOT=24, LEFT=4;
  const vals=points.map(p=>p.value);
  const lo=Math.min(...vals), hi=Math.max(...vals);
  const pad=(hi-lo)*0.15||1, min=lo-pad, max=hi+pad;
  const x=i=>LEFT+i*((W-LEFT-56)/(points.length-1));
  const y=v=>P+(H-P-BOT)*(1-(v-min)/(max-min));
  const line=points.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join("");
  const area=`${line}L${x(points.length-1).toFixed(1)},${H-BOT}L${x(0)},${H-BOT}Z`;
  const ticks=[min,(min+max)/2,max].map(v=>
    `<line class="gridline" x1="${LEFT}" y1="${y(v).toFixed(1)}" x2="${W-56}" y2="${y(v).toFixed(1)}"/>
     <text class="axislbl" x="${W-52}" y="${(y(v)+3).toFixed(1)}">${moneyK(v)}</text>`).join("");
  const dots=points.map((p,i)=>`<circle class="mark" data-i="${i}" cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}"
      r="${i===points.length-1?5:4}" fill="var(--brand)" stroke="var(--surface)" stroke-width="2"/>`).join("");
  const labels=points.map((p,i)=> (i%3===0||i===points.length-1)
    ? `<text class="axislbl" x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle">${fmtMonth(p.month)}</text>`:"").join("");
  return `<div class="chart" id="${id}">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Net worth over time">
      ${ticks}
      <path d="${area}" fill="var(--brand)" opacity=".10"/>
      <path d="${line}" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}${labels}
    </svg><div class="tip"></div></div>`;
}

/** Two series over time → grouped bars, 2px surface gap, legend + table. */
function chartYear(months, id){
  const W=pick(500,1150,1720), H=235, BOT=26, TOP=10, RIGHT=58;
  const max=Math.max(...months.flatMap(m=>[m.inM,m.outM]),1);
  const bw=(W-RIGHT)/months.length, gw=bw*0.34;
  const y=v=>TOP+(H-TOP-BOT)*(1-v/max);
  const ticks=[0,max/2,max].map(v=>
    `<line class="gridline" x1="0" y1="${y(v).toFixed(1)}" x2="${W-RIGHT}" y2="${y(v).toFixed(1)}"/>
     <text class="axislbl" x="${W-RIGHT+4}" y="${(y(v)+3).toFixed(1)}">${moneyK(v)}</text>`).join("");
  const bars=months.map((m,i)=>{
    const cx=i*bw+bw/2;
    const h1=Math.max(2,(H-TOP-BOT)*(m.inM/max)), h2=Math.max(2,(H-TOP-BOT)*(m.outM/max));
    return `<g class="mark" data-i="${i}">
      <rect x="${(cx-gw-1).toFixed(1)}" y="${y(m.inM).toFixed(1)}" width="${gw.toFixed(1)}" height="${h1.toFixed(1)}" rx="4" fill="var(--s1)"/>
      <rect x="${(cx+1).toFixed(1)}" y="${y(m.outM).toFixed(1)}" width="${gw.toFixed(1)}" height="${h2.toFixed(1)}" rx="4" fill="var(--s2)"/>
    </g>`;
  }).join("");
  const labels=months.map((m,i)=>`<text class="axislbl" x="${(i*bw+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${fmtMonth(m.mk)}</text>`).join("");
  return `<div class="chart" id="${id}">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Money in and out by month">${ticks}${bars}${labels}</svg>
    <div class="tip"></div>
    <div class="legend"><i><span class="sw" style="background:var(--s1)"></span>Money in</i>
      <i><span class="sw" style="background:var(--s2)"></span>Money out</i>
      <button class="tablebtn" data-act="tableYear" style="margin-left:auto">Show as table</button></div>
  </div>`;
}

function paydayRing(days, inc){
  const cycle={weekly:7,biweekly:14,semimonthly:15,monthly:30,once:30}[inc&&inc.freq]||30;
  const done=clamp((cycle-days)/cycle,0,1), r=20, c=2*Math.PI*r;
  return `<div class="ring"><svg width="50" height="50" viewBox="0 0 50 50">
    <circle class="track" cx="25" cy="25" r="${r}" fill="none" stroke-width="4"/>
    <circle class="fill" cx="25" cy="25" r="${r}" fill="none" stroke-width="4"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-done)).toFixed(1)}"/></svg>
    <div class="lbl">${days}<small>${days===1?"day":"days"}</small></div></div>`;
}

/** Net-worth series that always ends on the live figure, so the chart and the
    headline can never disagree. */
function worthSeries(){
  const pts=[...state.worthLog].slice(-12).map(p=>({...p}));
  const mk=monthKey(todayISO()), now=netWorth().net;
  const i=pts.findIndex(p=>p.month===mk);
  if(i>=0) pts[i].value=now; else pts.push({month:mk, value:now});
  return pts.slice(-12);
}

  <div class="ph"><h3>${title}</h3>${o.meta?`<span class="meta">${o.meta}</span>`:""}${o.action||""}</div>
  <div class="pb${o.flush?" flush":""}${o.mid?" mid":""}">${body}</div>
  ${o.foot?`<div class="pf">${o.foot}</div>`:""}</div>`;
const kvRow=(k,v,cls)=>`<div class="kv"><span class="k">${k}</span><span class="v ${cls||""}">${v}</span></div>`;

function kpiStrip(){
  const s=safeToSpend(), nw=netWorth(), np=nextPayday();
  const spent30=state.spends.filter(x=>x.date>=addDays(todayISO(),-29)).reduce((t,x)=>t+x.amount,0);
  const saved=state.goals.reduce((t,g)=>t+(+g.saved||0),0);
  const cycle={weekly:7,biweekly:14,semimonthly:15,monthly:30,once:30}[s.inc&&s.inc.freq]||30;
  const done=clamp((cycle-s.days)/cycle,0,1);
  return `<div class="kpis">
    <div class="kpi lead"><div class="k">Safe to spend</div>
      <div class="v ${s.value<0?"neg":""}">${money0(s.value)}</div>
      <div class="d">${np?`payday in ${s.days} day${s.days===1?"":"s"} · ${fmtDate(s.until)}`:"add your pay"}</div>
      <div class="spark"><i style="width:${(done*100).toFixed(0)}%"></i></div></div>
    <div class="kpi"><div class="k">Net worth</div><div class="v" style="color:var(--brand)">${money0(nw.net)}</div>
      <div class="d">${money0(nw.assets)} owned · ${money0(nw.debts)} owed</div></div>
    <div class="kpi"><div class="k">Spent · 30 days</div><div class="v">${money0(spent30)}</div>
      <div class="d">${state.spends.filter(x=>x.date>=addDays(todayISO(),-29)).length} entries</div></div>
    <div class="kpi"><div class="k">Bills to come</div><div class="v">${money0(s.bills)}</div>
      <div class="d">before payday</div></div>
    <div class="kpi"><div class="k">Saved so far</div><div class="v">${money0(saved)}</div>
      <div class="d">across ${state.goals.length} goal${state.goals.length===1?"":"s"}</div></div>
  </div>`;
}

function nextAction(){
  const t=todayISO();
  for(const b of state.bills){
    const due=billDates(b,addDays(t,-21),t).filter(d=>!billPaid(b,d)&&!b.sinking);
    if(due.length) return {text:`${esc(b.name)} was due ${fmtDate(due[due.length-1])} — ${money(b.amount)}`,
      cta:"Mark paid", act:"payBill", data:`data-id="${b.id}" data-date="${due[due.length-1]}"`};
  }
  if(!state.incomes.length) return {text:"Add your pay so the countdown works", cta:"Add", act:"addIncome"};
  if(!state.bills.length) return {text:"Add your first bill", cta:"Add", act:"addBill"};
  return null;
}

/** Walks the same day-by-day balance as runToPayday and reports the dip.
    Shared so the panel footer can never contradict the rows above it. */
function runLowPoint(){
  const s=safeToSpend(), t=todayISO(); let bal=spendBal();
  let low={value:bal, date:t};
  for(let i=0;i<=s.days;i++){
    const d=addDays(t,i);
    state.bills.filter(b=>!b.sinking).forEach(b=>{ if(billDates(b,d,d).length&&!billPaid(b,d)) bal-=b.amount; });
    state.incomes.forEach(i2=>{ if(incomeDates(i2,d,d).length) bal+=i2.amount*(1-(i2.autoSave||0)/100); });
    if(bal<low.value) low={value:bal, date:d};
  }
  return low;
}

function runToPayday(){
  const s=safeToSpend(), t=todayISO(); let bal=spendBal(); const rows=[];
  for(let i=0;i<=Math.min(s.days,14);i++){
    const d=addDays(t,i); let delta=0; const ev=[];
    state.bills.filter(b=>!b.sinking).forEach(b=>{ if(billDates(b,d,d).length&&!billPaid(b,d)){ delta-=b.amount; ev.push(`${b.name} −${money0(b.amount)}`);} });
    state.incomes.forEach(i2=>{ if(incomeDates(i2,d,d).length){ const n=i2.amount*(1-(i2.autoSave||0)/100); delta+=n; ev.push(`Paid +${money0(n)}`);} });
    bal+=delta;
    if(ev.length||i===0||i===s.days) rows.push(`<div class="r"><div class="m"><div class="t">${i===0?"Today":fmtDateLong(d)}</div>
      <div class="s">${ev.length?esc(ev.join(" · ")):"nothing due"}</div></div>
      <div class="a" style="color:${bal<0?"var(--bad)":"var(--ink)"}">${money0(bal)}</div></div>`);
  }
  return `<div class="dl cap">${rows.join("")||`<div class="empty">Add bills and pay to see the run.</div>`}</div>`;
}

function calendar(){
  const [y,m]=ui.calMonth.split("-").map(Number);
  const first=new Date(y,m-1,1), last=new Date(y,m,0), lead=first.getDay(), t=todayISO();
  let cells=""; ["S","M","T","W","T","F","S"].forEach(d=>cells+=`<div class="dh">${d}</div>`);
  for(let i=0;i<lead;i++) cells+=`<div class="dc blank"></div>`;
  for(let d=1;d<=last.getDate();d++){
    const ds=iso(new Date(y,m-1,d)); const pips=[];
    state.incomes.forEach(i=>{ if(incomeDates(i,ds,ds).length) pips.push("var(--s1)"); });
    state.bills.forEach(b=>{ if(billDates(b,ds,ds).length) pips.push("var(--s2)"); });
    const sp=state.spends.filter(s=>s.date===ds).reduce((a,s)=>a+s.amount,0);
    cells+=`<div class="dc ${ds===t?"today":""}"><span>${d}</span>
      ${sp?`<span style="font-size:9px;color:var(--ink-3)">${money0(sp)}</span>`:""}
      <span class="pips">${[...new Set(pips)].slice(0,3).map(p=>`<i class="pip" style="background:${p}"></i>`).join("")}</span></div>`;
  }
  const spend=state.spends.filter(s=>monthKey(s.date)===ui.calMonth).reduce((a,s)=>a+s.amount,0);
  return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
    <button class="iconbtn" data-act="calPrev" aria-label="Previous month">‹</button>
    <div style="flex:1;text-align:center;font-weight:600;font-size:14.5px">${first.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</div>
    <button class="iconbtn" data-act="calNext" aria-label="Next month">›</button></div>
    <div class="cal">${cells}</div>
    <div class="kv total"><span class="k">Spent this month</span><span class="v">${money(spend)}</span></div>`;
}

    <div class="kv"><span class="k">Set aside for big bills</span><span class="v">−${money(sinkingReserve())}</span></div>
    <div class="kv"><span class="k">Set aside for goals</span><span class="v">−${money(goalReserve())}</span></div>
    <div class="kv total"><span class="k">Safe to spend</span><span class="v">${money(s.value)}</span></div>
    <div class="hint" style="color:var(--ink-3);font-size:13px;margin-top:14px">
      Every figure above is one you typed in. Nothing is estimated and nothing is hidden.
      ${s.value<0?"<br><br>The number is below zero because the bills coming before payday are more than what's in the account. Better to know now.":""}</div>
    <button class="btn block ghost" data-sheet="close" style="margin-top:16px">Close</button>`);
}

function goalAddSheet(g){ openSheet("Add money to "+g.name,`
  <div class="field"><label>How much?</label><input id="gaAmt" type="number" step="0.01" inputmode="decimal" autofocus></div>
  <div class="kv"><span class="k">Saved so far</span><span class="v">${money(g.saved)}</span></div>
  <div class="kv"><span class="k">Target</span><span class="v">${money(g.target)}</span></div>
  <button class="btn primary block" data-sheet="save" style="margin-top:14px">Add</button>`,
  ()=>{ const a=sn("gaAmt"); if(a<=0) return toast("Enter an amount.");
    g.saved+=a; save(); closeSheet(); render();
    toast(g.saved>=g.target&&g.target>0?"Goal reached. Quietly brilliant.":"Added."); });
}

function debtPaySheet(d){ openSheet("Payment to "+d.name,`
  <div class="field"><label>How much did you pay?</label><input id="dpAmt" type="number" step="0.01" inputmode="decimal" value="${d.minimum||""}"></div>
  <div class="kv"><span class="k">Balance now</span><span class="v">${money(d.balance)}</span></div>
  <div class="btnrow" style="margin-top:14px"><button class="btn primary" data-sheet="save" style="flex:1">Record payment</button>
  <button class="btn ghost" data-sheet="editDebt" data-id="${d.id}">Edit debt</button></div>
  ${(d.payments||[]).length?`<div style="margin-top:16px">${[...d.payments].reverse().slice(0,8).map(p=>`<div class="kv"><span class="k">${fmtDate(p.date)}</span><span class="v">${money(p.amount)}</span></div>`).join("")}</div>`:""}`,
  ()=>{ const a=sn("dpAmt"); if(a<=0) return toast("Enter an amount.");
    d.payments=d.payments||[]; d.payments.push({date:todayISO(),amount:a});
    d.balance=Math.max(0,d.balance-a); save(); closeSheet(); render();
    toast(d.balance===0?"Paid off. That one's gone.":"Payment recorded."); });
}

function startFresh(){ openSheet("Start with your numbers",`
  <div class="hint" style="color:var(--ink-3);font-size:13.5px;margin-bottom:14px">
    This clears the example numbers and starts an empty planner. Four small steps and you'll have your own number.</div>
  <div class="field"><label>What should this be called?</label><input id="fName" placeholder="My money"></div>
  <div class="field"><label>What's in your current account right now?</label>
    <input id="fBal" type="number" step="0.01" inputmode="decimal" placeholder="Type it from your banking app"></div>
  <button class="btn primary block" data-sheet="save" style="margin-top:6px">Start</button>
  <div class="hint" style="color:var(--ink-3);font-size:12.5px;margin-top:10px">You can add pay and bills straight after.</div>`,
  ()=>{ const s=blankState();
    s.settings.name=sv("fName").trim()||"My money";
    s.settings.theme=state.settings.theme; s.settings.currency=state.settings.currency;
    s.accounts[0].balance=sn("fBal");
    state=s; ui.tab="today"; save(); closeSheet(); render(); toast("Ready. Add your pay next."); });
}

function wipe(){ openSheet("Delete everything?",`
  <div class="hint" style="color:var(--ink-3);font-size:13.5px;margin-bottom:16px">
    This removes every number from this browser. It cannot be undone. If you're not certain, close this and download a backup first.</div>
  <div class="btnrow"><button class="btn ghost" data-sheet="close" style="flex:1">Keep my numbers</button>
  <button class="btn danger" data-sheet="confirmWipe">Delete everything</button></div>`);
}

/* ---------- data table views (accessibility relief) ---------- */
function tableCats(){ const rows=spendByCategory();
  openSheet("Spending by category",`<table class="dtable"><thead><tr><th>Category</th><th style="text-align:right">${catRangeLabel()}</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${esc(r.cat)}</td><td class="n">${money(r.val)}</td></tr>`).join("")}</tbody></table>
    <button class="btn block ghost" data-sheet="close" style="margin-top:16px">Close</button>`);
}
function tableYear(){ const m=yearMonths();
  openSheet("Money in and out",`<table class="dtable"><thead><tr><th>Month</th><th style="text-align:right">In</th><th style="text-align:right">Out</th><th style="text-align:right">Kept</th></tr></thead>
    <tbody>${m.map(r=>`<tr><td>${fmtMonth(r.mk)}</td><td class="n">${money0(r.inM)}</td><td class="n">${money0(r.outM)}</td><td class="n">${money0(r.inM-r.outM)}</td></tr>`).join("")}</tbody></table>
    <button class="btn block ghost" data-sheet="close" style="margin-top:16px">Close</button>`);
}

/* ============================================================
   Actions
   ============================================================ */
function matchCategory(raw){ const c=String(raw||"").trim(); if(!c) return "Spend";
  const known=[...state.envelopes.map(e=>e.name), ...state.spends.map(s=>s.category)].filter(Boolean);
  const hit=known.find(k=>k.toLowerCase()===c.toLowerCase());
  return hit || c.charAt(0).toUpperCase()+c.slice(1); }

/** Spends the visitor typed themselves — example data must not count towards
    the demo cap, or a seeded demo is full before anyone opens it. */
const demoLogged = () => state.spends.filter(s => !s.seed).length;

function quickAdd(){ const el=$("#qInput"); if(!el) return;
  const raw=el.value.trim(); if(!raw) return;
  if(DEMO && demoLogged()>=DEMO_SPEND_CAP) return toast("The demo stops at "+DEMO_SPEND_CAP+" spends you log yourself. Everything you typed is still here.");
  const m=raw.match(/^\s*([\d.,]+)\s*(.*)$/); if(!m) return toast('Try something like "45 groceries".');
  const amount=Number(m[1].replace(/,/g,"")); if(!isFinite(amount)||amount<=0) return toast("That amount didn't look right.");
  state.spends.push({id:uid(),date:todayISO(),amount,category:matchCategory(m[2]),note:""});
  el.value=""; save(); render(); toast("Logged "+money(amount)+".");
}

function snapshot(){ const mk=monthKey(todayISO()), nw=netWorth();
  const i=state.worthLog.findIndex(w=>w.month===mk);
  if(i>=0) state.worthLog[i].value=nw.net; else state.worthLog.push({month:mk,value:nw.net});
  state.worthLog=state.worthLog.slice(-36); save(); render(); toast("Snapshot saved."); }

function backup(){ const b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b);
  a.download=`one-wallet-backup-${todayISO()}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast("Backup downloaded."); }
function restore(){ const i=document.createElement("input"); i.type="file"; i.accept="application/json,.json";
  i.onchange=()=>{ const f=i.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const p=JSON.parse(r.result); if(!p||!p.accounts) throw 0;
      state=p; state.exampleData=false; save(); render(); closeSheet(); toast("Restored. Welcome back."); }
      catch(e){ toast("That file didn't look like a One Wallet backup."); } };
    r.readAsText(f); }; i.click(); }
function csv(){ const rows=[["Date","Amount","Category","Note"]];
  [...state.spends].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>rows.push([s.date,s.amount,s.category||"",s.note||""]));
  const out=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([out],{type:"text/csv"}));
  a.download=`one-wallet-spending-${todayISO()}.csv`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast("CSV downloaded."); }

function demoBar(){ const bar=$("#demoBar"); bar.classList.remove("hidden");
  const left=Math.max(0,DEMO_SPEND_CAP-demoLogged());
  bar.innerHTML = left>0 ? `Free demo — the whole app, no watermark. ${left} spend${left===1?"":"s"} left to log.`
    : `Free demo — you've logged ${DEMO_SPEND_CAP} spends. Everything is still readable. Tap <strong>Download a backup</strong> in More to carry it into the full planner.`; }

let toastT=null;
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2600); }

/* ============================================================
   Chart interaction — hover tooltips (shipped by default)
   ============================================================ */
function bindChart(id, labelFor){
  const root=$("#"+id); if(!root) return;
  const tip=root.querySelector(".tip"); const marks=[...root.querySelectorAll(".mark")];
  if(!marks.length) return;
  const show=(el)=>{
    const i=+el.dataset.i; root.classList.add("dim"); marks.forEach(m=>m.classList.remove("hot")); el.classList.add("hot");
    if(tip){ const r=root.getBoundingClientRect(), b=el.getBoundingClientRect();
      tip.textContent=labelFor(i); tip.style.left=(b.left-r.left+b.width/2)+"px";
      tip.style.top=(b.top-r.top)+"px"; tip.classList.add("on"); }
  };
  const hide=()=>{ root.classList.remove("dim"); marks.forEach(m=>m.classList.remove("hot")); if(tip) tip.classList.remove("on"); };
  marks.forEach(m=>{
    m.style.cursor="pointer";
    m.addEventListener("mouseenter",()=>show(m));
    m.addEventListener("touchstart",()=>show(m),{passive:true});
  });
  root.addEventListener("mouseleave",hide);
  root.addEventListener("touchend",hide);
}

/* ============================================================
   Wiring
   ============================================================ */
function bindView(){
  const v=$("#view");
  v.querySelectorAll("[data-act]").forEach(el=>el.addEventListener("click",e=>{
    e.preventDefault(); const a=el.dataset.act, id=el.dataset.id;
    const by=arr=>arr.find(x=>x.id===id);
    switch(a){
      case "quickAdd": quickAdd(); break;
      case "why": whySheet(); break;
      case "addBill": billSheet(null); break;
      case "editBill": billSheet(by(state.bills)); break;
      case "toggleBill": case "payBill": toggleBill(by(state.bills), el.dataset.date); break;
      case "addIncome": incomeSheet(null); break;
      case "editIncome": incomeSheet(by(state.incomes)); break;
      case "editSpend": spendSheet(by(state.spends)); break;
      case "addGoal": goalSheet(null); break;
      case "editGoal": goalSheet(by(state.goals)); break;
      case "addToGoal": goalAddSheet(by(state.goals)); break;
      case "addDebt": debtSheet(null); break;
      case "payDebt": debtPaySheet(by(state.debts)); break;
      case "addAsset": assetSheet(null); break;
      case "editAsset": assetSheet(by(state.assets)); break;
      case "addAccount": accountSheet(); break;
      case "addEnvelope": envelopeSheet(); break;
      case "snapshot": snapshot(); break;
      case "backup": backup(); break;
      case "restore": restore(); break;
      case "csv": csv(); break;
      case "startFresh": startFresh(); break;
      case "wipe": wipe(); break;
      case "tableCats": tableCats(); break;
      case "tableYear": tableYear(); break;
      case "calPrev": ui.calMonth=monthKey(addMonths(ui.calMonth+"-01",-1)); render(); break;
      case "calNext": ui.calMonth=monthKey(addMonths(ui.calMonth+"-01",1)); render(); break;
      case "addBrain": { const i=$("#bdInput"); if(i&&i.value.trim()){ state.braindump.push({id:uid(),text:i.value.trim(),date:todayISO()}); i.value=""; save(); render(); } break; }
      case "delBrain": state.braindump=state.braindump.filter(b=>b.id!==id); save(); render(); break;
    }
  }));
  v.querySelectorAll("[data-tab]").forEach(el=>el.addEventListener("click",()=>{ui.tab=el.dataset.tab;scrollTo(0,0);render();}));
  v.querySelectorAll("[data-theme]").forEach(el=>el.addEventListener("click",()=>{state.settings.theme=el.dataset.theme;save();render();}));
  v.querySelectorAll("[data-cat]").forEach(el=>el.addEventListener("click",()=>{ui.catRange = el.dataset.cat==="month"?"month":+el.dataset.cat; render();}));
  v.querySelectorAll("[data-debtorder]").forEach(el=>el.addEventListener("click",()=>{ui.debtOrder=el.dataset.debtorder;render();}));
  const q=$("#qInput"); if(q) q.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();quickAdd();}});
  const bd=$("#bdInput"); if(bd) bd.addEventListener("keydown",e=>{ if(e.key==="Enter"&&bd.value.trim()){e.preventDefault();
    state.braindump.push({id:uid(),text:bd.value.trim(),date:todayISO()}); bd.value=""; save(); render(); }});
  v.querySelectorAll("[data-bal]").forEach(el=>el.addEventListener("change",()=>{
    const a=state.accounts.find(x=>x.id===el.dataset.bal);
    if(a){ a.balance=Number(el.value)||0; state.exampleData=false; save(); toast("Balance updated."); }}));
  ["owName","currency"].forEach(id=>{ const el=$("#"+id); if(!el) return;
    el.addEventListener("change",()=>{ if(id==="owName") state.settings.name=el.value.trim()||"My money";
      if(id==="currency") state.settings.currency=el.value; save(); render(); }); });

  // charts
  const cats=spendByCategory().slice(0,7);
  bindChart("catChart", i=> cats[i] ? `${cats[i].cat} · ${money(cats[i].val)}` : "");
  const pts=worthSeries();
  bindChart("worthChart", i=> pts[i] ? `${fmtMonth(pts[i].month)} · ${money(pts[i].value)}` : "");
  const ym=yearMonths();
  bindChart("yearChart", i=> ym[i] ? `${fmtMonth(ym[i].mk)} · in ${money0(ym[i].inM)} · out ${money0(ym[i].outM)}` : "");
}

function bindSheet(){
  $("#sheetBody").querySelectorAll("[data-sheet]").forEach(el=>el.addEventListener("click",e=>{
    e.preventDefault(); const a=el.dataset.sheet, id=el.dataset.id;
    const drop=(arr)=>arr.filter(x=>x.id!==id);
    if(a==="save"){ if(sheetSave) sheetSave(); return; }
    if(a==="close"){ closeSheet(); return; }
    if(a==="delBill"){ state.bills=drop(state.bills); }
    else if(a==="delIncome"){ state.incomes=drop(state.incomes); }
    else if(a==="delSpend"){ state.spends=drop(state.spends); }
    else if(a==="delGoal"){ state.goals=drop(state.goals); }
    else if(a==="delDebt"){ state.debts=drop(state.debts); }
    else if(a==="delAsset"){ state.assets=drop(state.assets); }
    else if(a==="editDebt"){ debtSheet(state.debts.find(x=>x.id===id)); return; }
    else if(a==="confirmWipe"){ try{localStorage.removeItem(KEY);}catch(e){} state=blankState(); closeSheet(); render(); toast("All gone."); return; }
    else return;
    save(); closeSheet(); render(); toast("Deleted.");
  }));
}

$("#sheetBg").addEventListener("click",closeSheet);
$("#sheetClose").addEventListener("click",closeSheet);
[$("#nav"), $("#side")].forEach(root => root.addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(!b) return;
  ui.tab=b.dataset.tab; scrollTo(0,0); render(); }));
$("#themeBtn").addEventListener("click",()=>{ state.settings.theme=state.settings.theme==="midnight"?"soft":"midnight"; save(); render(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
let _tier = layoutTier();
addEventListener("resize",()=>{ const t=layoutTier(); if(t!==_tier){ _tier=t; render(); } });

/* ---------- boot ---------- */
state=load();
if(!state.settings.debtOrder) state.settings.debtOrder="balance";
ui.debtOrder=state.settings.debtOrder;
render();
if(!DEMO && "serviceWorker" in navigator && location.protocol.startsWith("http"))
  navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
